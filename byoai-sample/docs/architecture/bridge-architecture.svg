<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>RCMS bridge architecture diagram</title>
<desc>Three-column architecture showing Avaya Infinity stack on the left, the RCMS bridge in the center, and the AI provider on the right</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text font-family="sans-serif" font-size="12" fill="#888" x="100" y="28" text-anchor="middle">Avaya Infinity</text>
<text font-family="sans-serif" font-size="12" fill="#888" x="340" y="28" text-anchor="middle">RCMS bridge</text>
<text font-family="sans-serif" font-size="12" fill="#888" x="580" y="28" text-anchor="middle">AI provider</text>
<line x1="220" y1="18" x2="220" y2="400" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>
<line x1="460" y1="18" x2="460" y2="400" stroke="#ccc" stroke-width="0.5" stroke-dasharray="4 4"/>
<rect x="35" y="44" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" x="110" y="66" text-anchor="middle" dominant-baseline="central">Caller</text>
<rect x="35" y="120" width="150" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" x="110" y="142" text-anchor="middle" dominant-baseline="central">Workflow</text>
<rect x="35" y="196" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" x="110" y="216" text-anchor="middle" dominant-baseline="central">AI Media Gateway</text>
<text font-family="sans-serif" font-size="12" fill="#0F6E56" x="110" y="234" text-anchor="middle" dominant-baseline="central">WSS connection point</text>
<rect x="35" y="284" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#085041" x="110" y="300" text-anchor="middle" dominant-baseline="central">Routing / Queues</text>
<text font-family="sans-serif" font-size="12" fill="#0F6E56" x="110" y="318" text-anchor="middle" dominant-baseline="central">Reporting &amp; analytics</text>
<line x1="110" y1="88" x2="110" y2="118" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="110" y1="164" x2="110" y2="194" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="110" y1="252" x2="110" y2="282" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="240" y="44" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C" x="340" y="64" text-anchor="middle" dominant-baseline="central">bridge_server.py</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="340" y="82" text-anchor="middle" dominant-baseline="central">WSS, session, media, auth</text>
<rect x="240" y="160" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C" x="340" y="180" text-anchor="middle" dominant-baseline="central">bot_service.py</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="340" y="198" text-anchor="middle" dominant-baseline="central">routes by botId prefix</text>
<rect x="240" y="276" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C" x="340" y="296" text-anchor="middle" dominant-baseline="central">Provider plugin</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="340" y="314" text-anchor="middle" dominant-baseline="central">echo / elevenlabs / gemini…</text>
<line x1="340" y1="100" x2="340" y2="158" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="340" y1="216" x2="340" y2="274" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="490" y="160" width="150" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C" x="565" y="180" text-anchor="middle" dominant-baseline="central">AI model</text>
<text font-family="sans-serif" font-size="12" fill="#993C1D" x="565" y="198" text-anchor="middle" dominant-baseline="central">Grok, Gemini, GPT…</text>
<line x1="185" y1="218" x2="238" y2="74" stroke="#1D9E75" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="sans-serif" font-size="12" fill="#1D9E75" x="192" y="142" text-anchor="middle">WSS</text>
<line x1="440" y1="296" x2="488" y2="190" stroke="#D85A30" stroke-width="1.5" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<line x1="240" y1="390" x2="260" y2="390" stroke="#1D9E75" stroke-width="1.5"/>
<text font-family="sans-serif" font-size="12" fill="#888" x="264" y="394">RCMS / WSS protocol</text>
<line x1="390" y1="390" x2="410" y2="390" stroke="#D85A30" stroke-width="1.5"/>
<text font-family="sans-serif" font-size="12" fill="#888" x="414" y="394">provider API</text>
</svg>
